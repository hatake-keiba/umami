<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="robots" content="noindex">
<title>UMAMI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&family=DM+Mono:wght@400;500&family=Outfit:wght@700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--ink:#111;--mute:#666;--soft:#999;--bg:#fff;--bg2:#fafaf7;--y:#fbf3d9;--b:#e6f0f8;--g:#e8f3e3;--p:#f6e6ec;--br:#f1e8da;--gr:#efefeb;}
*{margin:0;padding:0;box-sizing:border-box}
html{background:var(--bg2)}
body{background:var(--bg2);color:var(--ink);font-family:'M PLUS Rounded 1c','Zen Kaku Gothic New','Hiragino Maru Gothic ProN',Meiryo,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.mono{font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
a{color:inherit}
svg.ic{width:100%;height:100%;fill:none;stroke:#111;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.wrap{max-width:520px;margin:0 auto;padding:12px 14px 90px;min-height:100vh}
/* header */
.hd{display:flex;align-items:center;justify-content:space-between;min-height:40px}
.hd .wm{display:flex;align-items:center;gap:8px;font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;letter-spacing:.1em;line-height:1}
.hd .wm i{width:28px;height:28px;display:block}
.hd .wm small{display:block;font-family:'M PLUS Rounded 1c',sans-serif;font-size:9.5px;letter-spacing:.18em;color:var(--mute);margin-top:4px;font-weight:700;white-space:nowrap;text-align:center}
.hd .wm>div{text-align:center}
.hd .dt{font-family:'DM Mono',monospace;font-size:11px;color:var(--mute);text-align:right;line-height:1.4}
.hd .dt b{display:block;color:var(--ink);font-size:13px;font-weight:500}
.hd .bk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 10px 6px 6px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}
.hd .bk i{width:14px;height:14px;display:block}
section{display:none}section.on{display:block}
h2{font-size:17px;font-weight:900;margin-top:14px;display:flex;align-items:center;gap:8px}
h2 i{width:24px;height:24px;display:block}
.lead{font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.6}
h3{font-family:'DM Mono';font-size:10px;letter-spacing:.24em;color:var(--mute);font-weight:500;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
h3::after{content:"";flex:1;height:1.5px;background:#ddd}
/* segmented */
.seg{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:8px 0;font-size:12.5px;font-weight:800;color:var(--mute)}
.seg button.on{background:var(--ink);color:#fff}
.seg.sm button{padding:6px 0;font-size:11.5px}
/* baba strip */
.strip{margin-top:12px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.strip .ln{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1.5px solid #e6e6e2;width:100%;text-align:left}
.strip .ln:last-of-type{border-bottom:none}
.strip .ln i{width:20px;height:20px;display:block;flex:0 0 20px}
.strip .ln b{font-size:14px;font-weight:900;width:44px}
.strip .ln .v{font-size:11.5px;color:var(--mute);font-weight:700;flex:1}
.strip .ln .v em{font-style:normal;font-family:'DM Mono';color:var(--ink);font-weight:500}
.strip .ln .ar{width:12px;height:12px;display:block;transition:transform .15s}
.strip .ln.open .ar{transform:rotate(90deg)}
.strip .dt{display:none;padding:0 12px 12px;border-bottom:1.5px solid #e6e6e2}
.strip .dt.on{display:block}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;margin-top:10px}
.kv div{background:#fff;padding:8px 8px 6px}
.kv div.c{background:var(--gr,#efefeb)}
.kv div.t{background:var(--g)}
.kv div.d{background:var(--br)}
.kv label{display:block;font-size:9.5px;color:var(--mute);font-weight:700}
.kv b{font-family:'DM Mono';font-size:20px;font-weight:500}
.kv b small{font-size:10px;color:var(--mute);margin-left:2px}
.kv i{display:block;font-size:9px;color:var(--mute);font-style:normal;font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:4px}
.hw{overflow-x:auto;margin:0 -12px;padding:0 12px}
.hg{display:grid;gap:2px;min-width:420px}
.hg div{text-align:center;font-size:9px;color:var(--mute);padding:4px 0;border-top:1.5px solid #ddd;font-weight:700}
.hg div b{display:block;font-family:'DM Mono';font-size:10px;color:var(--ink);font-weight:500}
.hg div i{display:block;width:18px;height:18px;margin:2px auto}
.hg div span{display:block;font-family:'DM Mono';font-size:10px;color:var(--ink);font-weight:500}
.hg div span.pr{font-size:9px;color:var(--mute)}
.hg div.rain{background:var(--b);border-radius:6px}
.wk div{text-align:center;font-size:9px;color:var(--mute);padding:4px 0;border-top:1.5px solid #ddd}
.wk div b{display:block;font-family:'DM Mono';font-size:12px;color:var(--ink);font-weight:500}
.wk div i{display:block;width:18px;height:18px;margin:2px auto}
.wk div.rain{background:var(--b);border-radius:6px}
.note{font-size:11px;color:var(--mute);line-height:1.7;margin-top:8px}
.tico{margin-top:10px;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;background:#fff}
.tico svg{display:block}
.tico .wl{font-size:11px;font-weight:700;padding:8px 10px;border-top:1.5px solid var(--ink);background:#fafaf7}
.tico .wl b{margin:0 2px}
.note li{margin-left:1.2em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:11px;font-weight:700;padding:5px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}
.chip b{font-family:'DM Mono';font-weight:500;margin-left:4px}
.chip.y{background:var(--y)}.chip.g{background:var(--g)}.chip.b{background:var(--b)}
/* race grid */
.rg{display:grid;grid-template-columns:repeat(4,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin-top:10px}
.rb{background:#fff;padding:8px 7px 7px;text-align:left;min-height:62px;position:relative}
.rb .rn{font-family:'DM Mono';font-size:15px;font-weight:500;line-height:1}
.rb .rn i{font-style:normal;font-size:8.5px;color:var(--soft);margin-left:3px}
.rb .nm{font-size:9.5px;color:var(--mute);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700}
.rb .cd{font-family:'DM Mono';font-size:8.5px;margin-top:2px;color:var(--mute)}
.rb.g{background:var(--y)}
.rb.next{box-shadow:inset 0 0 0 1.5px var(--ink);background:var(--g)}
.rb .tag{position:absolute;right:5px;top:5px;font-family:'DM Mono';font-size:7.5px;color:var(--ink);border:1px solid var(--ink);border-radius:999px;padding:0 4px}
.rb.dis{background:#f1f1ee;color:#b5b5b0;cursor:default}
.rb.dis .rn,.rb.dis .nm,.rb.dis .cd,.rb.dis .rn i{color:#b5b5b0}
.rb .done{position:absolute;right:5px;top:5px;width:12px;height:12px}
/* race page */
.rh{margin-top:10px;text-align:center}
.rh .no{font-family:'DM Mono';font-size:10px;letter-spacing:.2em;color:var(--mute)}
.rh b{display:block;font-size:21px;font-weight:900;margin-top:2px}
.rh span{display:block;font-family:'DM Mono';font-size:10.5px;color:var(--mute);margin-top:2px}
.steps{position:sticky;top:0;z-index:20;background:var(--bg2);padding:10px 0 8px;margin-top:8px}
.steps .in{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}
.steps button{flex:1;padding:8px 0;font-size:11.5px;font-weight:800;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:4px}
.steps button i{font-style:normal;font-family:'DM Mono';font-size:10px}
.steps button.on{background:var(--ink);color:#fff}
.steps button .lk{width:10px;height:10px;display:block}
.steps button.on .lk svg{stroke:#fff}
.sec{margin-top:18px;scroll-margin-top:64px}
.sec .sh{display:flex;align-items:baseline;gap:8px;border-bottom:1.5px solid var(--ink);padding-bottom:6px}
.sec .sh i{font-family:'DM Mono';font-size:11px;font-weight:500;font-style:normal}
.sec .sh b{font-size:15px;font-weight:900}
.sec .sh span{font-size:10.5px;color:var(--mute);margin-left:auto;font-weight:700}
.bub{position:relative;border:1.5px solid var(--ink);border-radius:14px;background:#fff;padding:14px 12px 12px;margin-top:14px}
.bub.tail:after{content:"";position:absolute;left:50%;bottom:-10px;width:16px;height:16px;background:#fff;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.cat{display:flex;align-items:flex-start;justify-content:space-between}
.cat .it{flex:1;text-align:center;min-width:0}
.cat .it i{display:block;width:40px;height:40px;margin:0 auto 6px}
.cat .it b{display:block;font-family:'DM Mono';font-size:9.5px;font-weight:500;letter-spacing:.04em}
.cat .it small{display:block;font-size:9.5px;color:var(--mute);margin-top:2px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat .plus{font-family:'DM Mono';font-size:16px;font-weight:500;padding-top:12px}
.t{width:100%;border-collapse:collapse;font-size:12.5px;background:#fff}
.t th{font-family:'DM Mono';font-size:9.5px;color:var(--mute);font-weight:500;text-align:right;padding:6px 6px;border-bottom:1.5px solid var(--ink);white-space:nowrap;letter-spacing:.06em}
.t td{padding:7px 6px;border-bottom:1px solid #e3e3df;text-align:right;white-space:nowrap}
.t th.l,.t td.l{text-align:left}
.t td.nm{font-weight:800;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.t td small{color:var(--soft);font-family:'DM Mono';font-size:9.5px;margin-left:4px;font-weight:400}
.t tr.hi td{background:var(--g)}
.t tr.nige td.nm{box-shadow:inset 3px 0 var(--ink)}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
.cap{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;font-family:'DM Mono';font-weight:500;font-size:11.5px;box-shadow:inset 0 0 0 1.5px #111}
.kb{display:inline-block;font-size:10px;font-weight:800;padding:1px 7px;border-radius:999px;border:1.5px solid var(--ink)}
.kb.nige{background:var(--ink);color:#fff}.kb.senko{background:var(--y)}.kb.sashi{background:var(--b)}.kb.oikomi{background:#fff}
.lock{border:1.5px dashed var(--ink);border-radius:14px;padding:18px 14px;text-align:center;margin-top:12px;background:#fff}
.lock i{width:32px;height:32px;display:block;margin:0 auto 8px}
.lock p{font-size:12px;color:var(--mute);margin-bottom:12px;font-weight:700}
.lock .pw{display:flex;gap:6px;max-width:320px;margin:0 auto}
.lock input{flex:1;padding:10px;border:1.5px solid var(--ink);border-radius:999px;font-size:15px;text-align:center;letter-spacing:.14em;font-family:'DM Mono';min-width:0}
.lock button{padding:10px 16px;background:var(--ink);color:#fff;border-radius:999px;font-weight:800;font-size:13px}
.lock .er{color:#c0392b;font-size:11.5px;margin-top:8px;display:none}
.lock .n{font-size:10px;color:var(--soft);margin-top:10px}
/* sim */
.trk{position:relative;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;margin-top:12px}
.trk canvas{display:block;width:100%;height:auto;touch-action:none;cursor:grab}
.trk .st{position:absolute;left:12px;top:10px;font-size:12px;font-weight:900;line-height:1.3}
.trk .st small{display:block;font-family:'DM Mono';font-size:9px;font-weight:400;color:var(--mute)}
.trk .lg{position:absolute;right:10px;top:10px;font-family:'DM Mono';font-size:9px;line-height:1.5;color:var(--mute);text-align:right}
.trk .cp{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-family:'DM Mono';font-size:8.5px;color:var(--soft)}
.lead2{position:absolute;left:10px;bottom:20px;display:flex;align-items:center;gap:3px}
.lead2 span{font-family:'DM Mono';font-size:9px;color:var(--mute);margin-right:2px}
.lead2 b{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono';font-weight:500;box-shadow:inset 0 0 0 1.5px #111}
.fmt{margin-top:8px}
.fmt .fml{font-family:'DM Mono';font-size:9px;letter-spacing:.2em;color:var(--mute);margin:4px 0 2px}
.fmt canvas{display:block;width:100%;height:100px}
.btns{display:flex;gap:8px;margin-top:12px}
.bp{flex:1.7;padding:13px 8px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--ink)}
.bp:disabled{opacity:.5}
.bp svg{width:11px;height:11px;fill:#fff}
.bs{flex:1;padding:13px 6px;border-radius:999px;border:1.5px solid var(--ink);font-size:12.5px;font-weight:800;background:#fff}
.bs.on{background:var(--g)}
.pace{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:12px;font-size:12px;font-weight:800}
.pace .pb{width:36px;height:32px;border-radius:999px;border:1.5px solid var(--ink);font-family:'DM Mono';font-size:14px;font-weight:500;background:#fff}
.pace .pb.on{background:var(--ink);color:#fff}
.pace .nt{flex-basis:100%;font-size:10px;color:var(--soft);font-weight:700;margin-top:2px;padding-left:2px}
.b10k{margin-top:10px;width:100%;padding:12px 12px;border-radius:999px;border:1.5px solid var(--ink);font-size:13px;font-weight:900;display:flex;justify-content:space-between;align-items:center;background:#fff}
.b10k:disabled{opacity:.5}
.b10k i{width:16px;height:16px;display:block}
.res{margin-top:12px}
.res .row{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid #e3e3df;font-size:13px;font-weight:800}
.res .row .pl{width:34px;font-family:'DM Mono';font-size:12px;font-weight:500;color:var(--mute)}
.res .row .nm{flex:1}.res .row .nm small{font-weight:700;color:var(--soft);margin-left:5px;font-size:10px}
.res .row.top .pl{color:var(--ink)}
.bar{display:inline-block;height:6px;background:var(--ink);vertical-align:middle;margin-right:5px;border-radius:3px}
.free-n{font-size:11px;color:#b8641a;font-weight:800;margin-top:8px}
.kin{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.kin label{font-family:'DM Mono';font-size:9.5px;color:var(--mute);display:block;letter-spacing:.06em}
.kin input{width:100%;padding:8px;border:1.5px solid var(--ink);border-radius:8px;font-size:15px;font-family:'DM Mono';text-align:right;background:#fff}
.t input.c{width:56px;padding:4px;border:1.5px solid #ccc;border-radius:6px;font-size:12.5px;text-align:right;font-family:'DM Mono'}
.sum{display:flex;justify-content:space-between;font-size:13px;padding:8px 0;border-top:1.5px solid var(--ink);margin-top:6px;font-weight:900}
/* records / member */
.card{border:1.5px solid var(--ink);border-radius:12px;background:#fff;padding:12px;margin-top:10px}
.card .ttl{display:flex;align-items:center;gap:10px}
.card .ttl i{width:28px;height:28px;display:block;flex:0 0 28px}
.card .ttl b{font-size:13px;font-weight:900;display:block}
.card .ttl span{font-size:11px;color:var(--mute);font-weight:700;display:block}
.card .ttl .mono{margin-left:auto;font-size:10px;color:var(--mute)}
.lnk{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);border-radius:12px;padding:12px;text-decoration:none;margin-top:10px;background:#fff;text-align:left;width:100%}
.lnk i{width:30px;height:30px;display:block;flex:0 0 30px}
.lnk b{display:block;font-size:13px}.lnk span{font-size:11px;color:var(--mute)}
.stat{display:flex;gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:12px;overflow:hidden;margin-top:12px}
.stat div{flex:1;background:#fff;padding:10px 8px;text-align:center}
.stat label{display:block;font-family:'DM Mono';font-size:8.5px;color:var(--mute);letter-spacing:.1em}
.stat b{font-family:'DM Mono';font-size:22px;font-weight:500}
.mini{display:flex;gap:3px;margin-top:6px;flex-wrap:wrap}
.mini b{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-family:'DM Mono';font-weight:500;box-shadow:inset 0 0 0 1.5px #111}
.foot{font-size:10px;color:var(--soft);line-height:1.7;margin-top:24px;text-align:center}
.empty{border:1.5px dashed #bbb;border-radius:12px;padding:18px;text-align:center;color:var(--mute);font-size:12px;font-weight:700;margin-top:10px}
/* bottom bar */
.nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.5px solid var(--ink);z-index:30}
.nav .in{max-width:520px;margin:0 auto;display:flex;justify-content:space-around;padding:8px 0 10px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:9.5px;font-weight:800;color:var(--mute);width:80px}
.nav button i{width:24px;height:24px;display:block}
.nav button em{font-style:normal;font-family:'DM Mono';font-size:7.5px;letter-spacing:.12em;color:var(--soft);font-weight:400;line-height:1;margin-top:1px}
.nav button.on{color:var(--ink)}
.nav button:not(.on) svg{stroke:#888}
@media (max-width:400px){.rg{grid-template-columns:repeat(3,1fr)}}

/* race page extras */
.hito{margin-top:12px;border:1.5px solid var(--ink);border-radius:12px;background:var(--y);padding:10px 12px;font-size:12px;font-weight:700;line-height:1.7}
.hito div{padding-left:1em;text-index:-1em;position:relative}.hito div:before{content:"・";position:absolute;left:0}
.fsvg svg{display:block}
.pm .pmb{position:relative;height:22px;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;background:linear-gradient(90deg,var(--g) 0 32%,var(--y) 32% 55%,var(--p) 55% 100%);display:flex}
.pm .pmb span{flex:1;text-align:center;font-family:'DM Mono';font-size:10px;line-height:20px;color:var(--mute)}
.pm .pmb i{position:absolute;top:-1px;bottom:-1px;width:3px;background:var(--ink);transform:translateX(-50%)}
.pm .pml{display:flex;justify-content:space-between;font-size:11px;font-weight:700;margin-top:6px;gap:8px;flex-wrap:wrap}
.t tr[data-h]{cursor:pointer}
.hcard{display:none}.hcard.on{display:table-row}
.hcard td{padding:0 0 8px;text-align:left;white-space:normal}
.hc{border:1.5px solid var(--ink);border-radius:10px;padding:10px;background:var(--bg2)}
.hcl{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}.hcl b{font-family:'DM Mono';font-size:10px;letter-spacing:.14em;color:var(--mute);font-weight:500}.hcl span{font-size:14px;font-weight:900}
.hcg{display:grid;grid-template-columns:repeat(2,1fr);gap:1.5px;background:var(--ink);border:1.5px solid var(--ink);border-radius:8px;overflow:hidden}
.hcg div{background:#fff;padding:7px 8px 6px}.hcg label{display:block;font-size:9.5px;color:var(--mute);font-weight:700}.hcg b{display:block;font-size:13px;font-weight:900}.hcg b.mono{font-weight:500}.hcg i{display:block;font-style:normal;font-size:9.5px;color:var(--soft);font-weight:700}
.hcg.ans{margin-top:0;background:transparent;border:none;gap:6px;border-radius:0}
.hcg.ans div{border:1.5px solid var(--ink);border-radius:8px}
.gap{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gc{border:1.5px solid var(--ink);border-radius:10px;padding:8px}.gc.g{background:var(--g)}.gc.p{background:var(--p)}
.gc label{display:block;font-size:10px;font-weight:800;margin-bottom:6px}.gc div{display:flex;align-items:center;gap:6px;font-size:11px;margin-top:4px;flex-wrap:wrap}.gc div b{font-weight:800}.gc div .mono{font-size:9.5px;color:var(--mute);width:100%;padding-left:28px}

/* ===== 合い言葉 ===== */
function b64d(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function decrypt(pw){const enc=new TextEncoder();
  const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(PAID.salt),iterations:PAID.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(PAID.iv)},key,b64d(PAID.ct)); return JSON.parse(new TextDecoder().decode(pt));}
async function tryUnlock(pw,remember){
  try{ const paid=await decrypt(pw); member=true;
    Object.entries(paid.races).forEach(([rid,pr])=>{ const r=byRid[rid]; if(!r) return; r.load_rate=pr.load_rate; r.nige=pr.nige; r.pace_z=pr.pace_z; r.pace_pf=pr.pace_pf; r.pace_cls=pr.pace_cls; r.pace_pos=pr.pace_pos; r.pace_p=pr.pace_p; const m={}; pr.runners.forEach(x=>m[x.uno]=x); r.runners.forEach(h=>Object.assign(h,m[h.uno]||{})); });
    if(remember) ls.set(LSK,{pw,d:FREE.date});
    renderAll(); return true; }catch(e){ return false; }
}
function lockBox(msg){ return `<div class="lock">${ico('lock')}<p>${esc(msg)}</p><div class="pw"><input type="password" placeholder="合い言葉" autocomplete="off" onkeydown="if(event.key==='Enter')unlockFrom(this)"><button onclick="unlockFrom(this.previousElementSibling)">解錠</button></div><div class="er">合い言葉が違います</div><div class="n">合い言葉は note の会員記事に掲載（試作中）</div></div>`; }
async function unlockFrom(inp){ const box=inp.closest('.lock'); const ok=await tryUnlock(inp.value.trim(),true); if(!ok){ box.querySelector('.er').style.display='block'; } }

  hs.forEach(h=>{ if(!st[h.uno]){ const p=h.h1c1||h.prevpos; st[h.uno]= p==null?'差し': p<=1?'逃げ': p<=4?'先行': p<=Math.max(6,hs.length*0.6)?'差し':'追込'; }}); return st; }

function isMain(r){ return !r.jump && (!!r.grade || r.R===11); }
function isFree(r){ return isMain(r); }
function mem(r){ return member||(r&&isMain(r)); }
function strengths(r){ const hs=r.runners, n=hs.length; let p, src;
  if(hs.some(h=>h.pred_jv!=null)){ p=hs.map(h=>h.pred_jv!=null?h.pred_jv:null); src='UMAMI AI勝率（走破時計・能力・展開）'; }
  else if(hs.some(h=>h.pred!=null)){ p=hs.map(h=>h.pred!=null?h.pred:null); src='HIVE勝率'; }
  else if(hs.some(h=>h.odds)){ p=hs.map(h=>h.odds?Math.pow(1/h.odds,0.93):null); src='市場評価'; }
  else { const rk=(key)=>{ const v=hs.map((h,i)=>[h[key],i]).filter(x=>x[0]!=null).sort((a,b)=>a[0]-b[0]); const o={}; v.forEach((x,k)=>o[x[1]]=k/Math.max(1,v.length-1)); return o; }; const ra=rk('lap_agari'), rt=rk('lap_ten');
    p=hs.map((h,i)=>{ let s=0; s+= ra[i]!=null?(1-ra[i])*1.1:0.4; s+= rt[i]!=null?(1-rt[i])*0.5:0.2; if(h.prevpos!=null) s+=Math.max(0,1-(h.prevpos-1)/8)*0.5; return Math.exp(s*1.6); }); src='暫定（ラップ・前走位置）'; }
  const vals=p.filter(v=>v!=null), m=vals.reduce((a,b)=>a+b,0)/Math.max(1,vals.length); p=p.map(v=>v==null?m*0.4:v); const s=p.reduce((a,b)=>a+b,0); return {p:p.map(v=>v/s),src}; }
function adjust(r,st,pace){ /* 実際のペース別(事後)に、脚質ごとの実勝率/HIVE想定 の対数比(2022-2026 OOS)。中心化 */
  const T={H:{'逃げ':.058,'先行':.020,'差し':.049,'追込':.049},M:{'逃げ':.174,'先行':.113,'差し':.010,'追込':-.030},S:{'逃げ':.278,'先行':.140,'差し':-.020,'追込':-.151}}[pace]||{};
  const hs=r.runners, raw=hs.map(h=>T[st[h.uno]]??.02), m=raw.reduce((x,y)=>x+y,0)/Math.max(1,raw.length); return raw.map(v=>v-m); }

const gumbel=()=>-Math.log(-Math.log(Math.random()+1e-12)+1e-12);

function courseGeom(r){ const c=COURSE[r.place]||COURSE['06'], t=r.surface==='ダ'?c.dirt:c.turf, L=t.S, C=t.C, rad=(C-2*L)/(2*Math.PI), sgn=c.turn==='右'?-1:1;

function paceMeter(r,pl,pk){ const v=r.load_rate; const x=r.pace_pos!=null?r.pace_pos:(v==null?null:Math.max(0,Math.min(100,v))); const nige=(r.runners.some(h=>h.fm!=null)?r.runners.filter(h=>h.fm!=null).sort((a,b)=>a.fm-b.fm):r.runners.filter(h=>h.ten1f!=null).sort((a,b)=>a.ten1f-b.ten1f)).slice(0,2);

      <div><label>調教師 今年</label><b class="mono">${tt?'勝'+tt.win.toFixed(0)+'% 複'+tt.place.toFixed(0)+'%':'—'}</b><i>${esc(h.trainer)} ${rec3(tt)}</i></div>

function tenkaiBody(r,st,pl,pk,g,cnt){ const ag=r.runners.filter(h=>h.lap_agari).map(h=>h.lap_agari).sort((a,b)=>a-b), agTh=ag[2]; const tn=r.runners.filter(h=>h.lap_ten).map(h=>h.lap_ten).sort((a,b)=>a-b), tnTh=tn[2]; const nige=r.runners.find(h=>st[h.uno]==='逃げ');

    r.runners.map(h=>`<tr data-h="${h.uno}" class="${st[h.uno]==='逃げ'?'nige':''}"><td class="l">${cap(h)}</td><td class="l nm">${esc(h.name)}<small>${esc(h.jockey)}</small></td><td class="l"><span class="kb ${STYLE_CLS[st[h.uno]]}">${st[h.uno]}</span></td>
      <td class="mono" style="${tnTh!=null&&h.lap_ten<=tnTh?'font-weight:700;text-decoration:underline':''}">${h.lap_ten!=null?h.lap_ten.toFixed(1):'—'}</td><td class="mono" style="${agTh!=null&&h.lap_agari<=agTh?'font-weight:700;text-decoration:underline':''}">${h.lap_agari!=null?h.lap_agari.toFixed(1):'—'}</td><td class="mono">${h.prevpos!=null?h.prevpos:'—'}</td></tr>`+horseCard(r,h,st)).join('')+
    `</tbody></table></div><div class="note">テン・上がりは直近10走の最速（下線＝上位3頭）。脚質はテン1F実績順から想定。PREV＝前走の最初のコーナー位置。</div>`; }
/* 3. 勝率・期待値 + 市場とのズレ */
function aiBody(r,st){ const hs=r.runners; const hasP=hs.some(h=>h.pred!=null), hasO=hs.some(h=>h.odds);
  const rows=hs.map(h=>({h,ev:(h.pred!=null&&h.odds)?h.pred*h.odds:null})).sort((a,b)=>(b.h.pred||0)-(a.h.pred||0));
  let gap=''; if(hasP&&hasO){ const ai=rows.map((x,i)=>({u:x.h.uno,ar:i+1})); const pr=[...hs].sort((a,b)=>(a.pop||99)-(b.pop||99)); const pm={}; pr.forEach((h,i)=>pm[h.uno]=h.pop||i+1); const dif=ai.map(x=>({u:x.u,ar:x.ar,pr:pm[x.u],d:pm[x.u]-x.ar})).filter(x=>x.pr!=null);
    const over=dif.filter(x=>x.d>=3).sort((a,b)=>b.d-a.d).slice(0,3), under=dif.filter(x=>x.d<=-3).sort((a,b)=>a.d-b.d).slice(0,3); const H=u=>hs.find(h=>h.uno===u);
    gap=`<h3>市場とのズレ</h3><div class="gap"><div class="gc g"><label>AIが市場より買っている</label>${over.length?over.map(x=>`<div>${cap(H(x.u))}<b>${esc(H(x.u).name)}</b><span class="mono">AI ${x.ar}位 ／ 人気 ${x.pr}位</span></div>`).join(''):'<div class="mono" style="color:var(--soft)">大きなズレなし</div>'}</div>
      <div class="gc p"><label>AIが市場より売っている</label>${under.length?under.map(x=>`<div>${cap(H(x.u))}<b>${esc(H(x.u).name)}</b><span class="mono">AI ${x.ar}位 ／ 人気 ${x.pr}位</span></div>`).join(''):'<div class="mono" style="color:var(--soft)">大きなズレなし</div>'}</div></div>`; }
  return gap+`<h3>全頭</h3><div class="tw"><table class="t"><thead><tr><th class="l">番</th><th class="l">馬名</th><th>勝率</th><th>3着内</th><th>単勝</th><th>期待値</th></tr></thead><tbody>`+
    rows.map(x=>`<tr class="${x.ev!=null&&x.ev>=1.2?'hi':''}"><td class="l">${cap(x.h)}</td><td class="l nm">${esc(x.h.name)}<small>${st[x.h.uno]}</small></td><td class="mono">${pct(x.h.pred)}</td><td class="mono">${x.h.pred_place!=null?(x.h.pred_place*100).toFixed(0)+'%':'—'}</td><td class="mono">${x.h.odds?x.h.odds.toFixed(1):'—'}</td><td class="mono" style="${x.ev!=null&&x.ev>=1.2?'font-weight:700;text-decoration:underline':''}">${x.ev!=null?x.ev.toFixed(2):'—'}</td></tr>`).join('')+

/* 4. 買い方: Kelly + 券種の提案 */
let K={budget:10000,frac:0.25};
function ticketIdeas(r){ const hs=r.runners.filter(h=>h.pred!=null); if(hs.length<4) return ''; const top=[...hs].sort((a,b)=>b.pred-a.pred); const a=top[0],b=top[1],c=top[2],d=top[3];
  const ev=[...hs].filter(h=>h.odds).map(h=>({h,ev:h.pred*h.odds})).sort((x,y)=>y.ev-x.ev)[0];
  const P=(x,y)=>`${cap(x)}<span class="dash">–</span>${cap(y)}`;
  return `<h3>券種の提案</h3><div class="tk"><div><label>馬連 3点（上位3頭ボックス）</label><div class="tks">${P(a,b)}${P(a,c)}${P(b,c)}</div><i>上位3頭の勝率合計 ${pct(a.pred+b.pred+c.pred)}</i></div>
    <div><label>ワイド 3点（本命から）</label><div class="tks">${P(a,b)}${P(a,c)}${P(a,d)}</div><i>本命 ${esc(a.name)} 複勝率 ${a.pred_place!=null?(a.pred_place*100).toFixed(0)+'%':'—'}</i></div>
    ${ev&&ev.ev>=1.2&&ev.h.uno!==a.uno?`<div><label>妙味の単勝 1点</label><div class="tks">${cap(ev.h)}<b style="margin-left:6px">${esc(ev.h.name)}</b></div><i>期待値 ${ev.ev.toFixed(2)}（勝率 ${pct(ev.h.pred)} × 単勝 ${ev.h.odds.toFixed(1)}）</i></div>`:''}
  </div><div class="note">組み合わせの候補です。買うかどうか、いくら買うかは下の配分で決めてください。</div>`; }
function kellyBody(r){ return ticketIdeas(r)+`<h3>単勝の最適配分</h3><div class="kin"><div><label>予算（円）</label><input id="kb" type="number" value="${K.budget}" step="1000"></div><div><label>攻め度（0.05＝堅実 〜 1＝全力）</label><input id="kf" type="number" value="${K.frac}" step="0.05" min="0.05" max="1"></div></div>
  <div class="tw"><table class="t" id="kt"><thead><tr><th class="l">番</th><th class="l">馬名</th><th>勝率</th><th>単勝</th><th>配分</th><th>買う額</th></tr></thead><tbody>`+
  r.runners.map(h=>`<tr data-uno="${h.uno}"><td class="l">${cap(h)}</td><td class="l nm">${esc(h.name)}</td><td><input class="c kp" value="${h.pred!=null?(h.pred*100).toFixed(1):''}"></td><td><input class="c ko" value="${h.odds?h.odds.toFixed(1):''}"></td><td class="mono kk">—</td><td class="mono ky">—</td></tr>`).join('')+
  `</tbody></table></div><div class="sum"><span>合計</span><span class="mono" id="ksum">—</span></div><div class="note">勝率とオッズから「有利な馬ほど多く」配る計算です（配分はKelly基準）。攻め度は配る量の強さで、0.25なら理論値の4分の1に抑えた堅実寄り。不利な馬には配りません。合計が予算を超えるときは全体を縮めます。100円単位。勝率は自分の見立てに書き換えられます。</div>`; }
function bindKelly(r){ const calc=()=>{ K.budget=+$('#kb').value||0; K.frac=+$('#kf').value||0.25; const rows=[...document.querySelectorAll('#kt tbody tr')]; let fs=rows.map(tr=>{ const p=(+tr.querySelector('.kp').value||0)/100, o=+tr.querySelector('.ko').value||0; if(p<=0||o<=1) return 0; const b=o-1; return Math.max(0,(p*b-(1-p))/b)*K.frac; }); const tot=fs.reduce((a,b)=>a+b,0); if(tot>1) fs=fs.map(f=>f/tot); let sum=0; rows.forEach((tr,i)=>{ const y=Math.round(fs[i]*K.budget/100)*100; sum+=y; tr.querySelector('.kk').textContent=fs[i]>0?(fs[i]*100).toFixed(1)+'%':'—'; tr.querySelector('.ky').textContent=y>0?y.toLocaleString()+'円':'—'; tr.classList.toggle('hi',y>0); }); $('#ksum').textContent=sum.toLocaleString()+'円'; };
  document.querySelectorAll('#sec-bet input').forEach(i=>i.oninput=calc); calc(); }
/* 5. 結果・答え合わせ */
function resultBody(r,st){ const res=r.result, hs=r.runners, H=u=>hs.find(h=>h.uno===u); const rec=(ls.get(RECK,{})||{})[r.rid]||{}; const top=res.order.slice(0,3).map(H).filter(Boolean);
  const ai=hs.filter(h=>h.pred!=null).sort((a,b)=>b.pred-a.pred)[0]; const aiPos=ai?res.order.indexOf(ai.uno)+1:0;
  let mc=''; if(rec.mc){ const w=H(res.order[0]); const i=hs.indexOf(w); const mcTop=hs[rec.mc.win.indexOf(Math.max(...rec.mc.win))]; mc=`<div><label>全体勝率の本命</label><b>${mcTop.uno} ${esc(mcTop.name)}</b><i>${res.order.indexOf(mcTop.uno)+1}着（勝率 ${pct(rec.mc.win[hs.indexOf(mcTop)])}）</i></div><div><label>勝った馬の全体勝率</label><b class="mono">${i>=0?pct(rec.mc.win[i]):'—'}</b><i>${i>=0?(rec.mc.win[i]>=0.2?'順当':rec.mc.win[i]>=0.08?'想定内':'波乱'):''}</i></div>`; }
  const runs=(rec.runs||[]); const hit=runs.filter(x=>x.order[0]===res.order[0]).length;
  return `<div class="resu">${top.map((h,i)=>`<div class="row top"><span class="pl">${i+1}着</span>${cap(h)}<span class="nm">${esc(h.name)}<small>${st[h.uno]}</small></span></div>`).join('')}${res.tansho?`<div class="note" style="margin-top:6px">単勝 ${res.tansho.toLocaleString()}円</div>`:''}</div>
    <h3>答え合わせ</h3><div class="hcg ans">${ai?`<div><label>AIの本命</label><b>${ai.uno} ${esc(ai.name)}</b><i>${aiPos?aiPos+'着':'—'}（勝率 ${pct(ai.pred)}）</i></div>`:''}${mc}${runs.length?`<div><label>走らせた ${runs.length}回</label><b class="mono">${hit}回 的中</b><i>1着が一致した回数</i></div>`:''}</div>`; }

/* ===== 走る ===== */
function openSim(r){

  const st=styleOf(r), str=strengths(r), [pl,ap]=paceOf(r);
  S={r,st,p:str.p,src:str.src,autoPace:ap,pace:'A',runPace:ap,speed:1,view3d:true,running:false,order:null,t:0,tracks:null,raf:0,geo:courseGeom(r)};
  const g=S.geo, left=runsLeft(r);
  $('#simbox').innerHTML=`
    <div class="trk"><canvas id="cv"></canvas><div class="st" id="st">スタート待ち<small>ELEV ${g.H}m (exaggerated)</small></div>
      <div class="lg">${r.surface==='ダ'?'DIRT':'TURF'} ${r.dist}m<br>${g.c.turn==='右'?'RIGHT':'LEFT'} ・ STR ${g.L}m</div>
      <div class="lead2" id="ld"></div><div class="cp">drag=rotate ・ pinch=zoom</div></div>

function buildTrack3D(){ const g=S.geo, r=S.r, dirt=r.surface==='ダ'; const EX=Math.min(16,40/Math.max(1,g.H)); g.EX=EX; const hT=s=>g.elev(s)*EX, hD=s=>g.elev(s)*EX*0.9-1.5;
  const grp=new THREE.Group(); T.group=grp; const W=g.W, dOff=-(W+12), DEP=9;
  grp.add(bandMesh(g,0,W,hT, dirt?0xf1f1ed:0xffffff, DEP));
  grp.add(bandMesh(g,dOff,W*0.85,hD, dirt?0xffffff:0xf1f1ed, DEP-3));
  [[W/2,hT,DEP],[-W/2,hT,DEP],[dOff+W*0.85/2,hD,DEP-3],[dOff-W*0.85/2,hD,DEP-3]].forEach(([o,f,d])=>{ grp.add(outline(g,o,f,0.3,INK,false)); grp.add(outline(g,o,s=>f(s)-d,0,INK,false)); });
  // 内馬場(白) + 木
  const N=140, ipos=[0,-1.2,0], iidx=[]; for(let i=0;i<N;i++){const s=i/N*g.C,p=g.pos(s),n=normalAt(g,s),o=dOff-W*0.85/2-2; ipos.push(p[0]+n[0]*o,-1.2,p[1]+n[1]*o);} for(let i=1;i<=N;i++){iidx.push(0,i%N+1,i);}
  const ig=new THREE.BufferGeometry(); ig.setAttribute('position',new THREE.Float32BufferAttribute(ipos,3)); ig.setIndex(iidx); grp.add(new THREE.Mesh(ig,new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})));
  [[-0.3,0.35],[0.25,-0.3],[0.05,0.15],[-0.15,-0.2],[0.35,0.25]].forEach(([fx,fz],i)=>{ const t=lineSprite(drawTree,34+(i%2)*8); t.position.set(fx*(g.L+g.rad)*0.6, 10, fz*g.rad*0.8); grp.add(t); });
  const railOff=dirt?dOff:0, railW=dirt?W*0.85:W, hR=dirt?hD:hT; grp.add(outline(g,railOff,hR,0.4,0x777777,true));
  // スタンド(線画の箱 + トーン屋根)
  const stz=g.rad+W/2+26, st=new THREE.Mesh(new THREE.BoxGeometry(g.L*0.9,10,16),new THREE.MeshBasicMaterial({color:0xffffff})); st.position.set(0,hT(0)+5,stz); grp.add(st); const se=new THREE.LineSegments(new THREE.EdgesGeometry(st.geometry),new THREE.LineBasicMaterial({color:INK})); se.position.copy(st.position); grp.add(se);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(g.L*0.9+6,1.2,22),new THREE.MeshBasicMaterial({map:T.hatch})); roof.position.set(0,hT(0)+11,stz-1); grp.add(roof); const re=new THREE.LineSegments(new THREE.EdgesGeometry(roof.geometry),new THREE.LineBasicMaterial({color:INK})); re.position.copy(roof.position); grp.add(re);
  const fl=lineSprite(drawFlag,28); fl.position.set(-g.L*0.42,hT(0)+22,stz-1); grp.add(fl);
  // ハロン棒 / ゴール / 頂上 / スタート
  for(let s=200;s<g.C-50;s+=200){ grp.add(crossLine(g,s,railW,railOff,hR(s)+.5,0xbbbbbb)); }
  grp.add(crossLine(g,0,railW+6,railOff,hR(0)+.6,INK)); const gp=g.pos(0),gn=normalAt(g,0);
  const gl=labelSprite('GOAL','#fff','#111',16,'#111'); gl.position.set(gp[0]+gn[0]*(railOff+railW/2+6),hR(0)+18,gp[1]+gn[1]*(railOff+railW/2+6)); grp.add(gl);
  grp.add(crossLine(g,g.peakS,railW+4,railOff,hR(g.peakS)+.6,0xc0392b)); const pl=labelSprite('TOP','#c0392b','#fff',14,'#c0392b'); const pp=g.pos(g.peakS); pl.position.set(pp[0],hR(g.peakS)+18,pp[1]); grp.add(pl);
  const s0=((-r.dist%g.C)+g.C)%g.C; g.s0=s0; grp.add(crossLine(g,s0,railW+4,railOff,hR(s0)+.6,INK)); const sl=labelSprite('START','#111','#fff',16,'#111'); const sp=g.pos(s0); sl.position.set(sp[0],hR(s0)+18,sp[1]); grp.add(sl);
  T.horses=r.runners.map(h=>{const q=horseNode(h); grp.add(q); return q;}); T.railOff=railOff; T.railW=railW; T.hR=hR;
  T.scene.add(grp); placeHorses(); }
function horsePos(i,gapx){ const g=S.geo,h=S.r.runners[i]; let s,lane; if(!S.tracks){ s=g.s0-(h.uno-1)*3.2*gapx; lane=((h.waku||4)-1)/7; } else { s=g.s0+Math.max(0,S.tracks.lead(S.t)-S.tracks.gap(i,S.t)*gapx); lane=S.tracks.lane(i,S.t); } return {s,lane}; }
function placeHorses(){ if(!T||!S||!T.horses.length) return; const g=S.geo,gapx=T.follow?2.6:5.5;
  T.horses.forEach((q,i)=>{ const {s,lane}=horsePos(i,gapx), p=g.pos(s),n=normalAt(g,s),off=T.railOff+(lane-0.5)*T.railW*0.9; q.position.set(p[0]+n[0]*off,T.hR(s),p[1]+n[1]*off); }); drawFormation(); }
function camDir(){ return new THREE.Vector3(Math.sin(T.pol)*Math.sin(T.az),Math.cos(T.pol),Math.sin(T.pol)*Math.cos(T.az)); }
function placeCam(){ const cam=T.camera; cam.position.copy(T.target).add(camDir().multiplyScalar(1500)); cam.lookAt(T.target); cam.zoom=T.zoom; cam.updateProjectionMatrix(); }
function fitCamera(){ if(!T||!S) return; const g=S.geo,cam=T.camera; T.target.set(0,0,8); T.follow=false; T.zoom=1; placeCam();
  const X=g.L/2+g.rad+g.W+20, Z=g.rad+g.W+40, Y=60; let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9; [[-X,-Z],[X,-Z],[-X,Z],[X,Z]].forEach(([x,z])=>[0,Y].forEach(y=>{ const v=new THREE.Vector3(x,y,z).project(cam); mnx=Math.min(mnx,v.x);mxx=Math.max(mxx,v.x);mny=Math.min(mny,v.y);mxy=Math.max(mxy,v.y); }));
  T.zoom=Math.min(2/(mxx-mnx),2/(mxy-mny))*0.97; T.fitZoom=T.zoom; placeCam(); }
function followCam(){ if(!S.tracks||!S.order) return; const g=S.geo,i=S.order[0],s=g.s0+S.tracks.dist(i,S.t),p=g.pos(s); T.target.lerp(new THREE.Vector3(p[0],T.hR(s),p[1]),0.12); T.zoom+= (T.fitZoom*2.6-T.zoom)*0.1; placeCam(); }
function loop3D(){ if(!T) return; T.anim=requestAnimationFrame(loop3D); if(!S||!document.getElementById('cv')||!document.getElementById('s-race').classList.contains('on')) return; placeHorses(); if(T.follow&&S.running) followCam();
  const k=T.fitZoom/T.zoom*(T.follow?1.7:1); T.horses.forEach(q=>q.userData.sp.scale.set(24*k,24*k,1)); T.labels.forEach(sp=>{ const b=sp.userData.base; if(sp.material.map&&sp.scale.x!==sp.scale.y*2) sp.scale.set(b*k,b*k,1); else sp.scale.set(b*2*k,b*k,1); }); T.renderer.render(T.scene,T.camera); }
function bindOrbit(){ const cv=T.cv; let lx=0,ly=0,drag=false,pd=0,two=false;
  cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch'){drag=true;lx=e.clientX;ly=e.clientY;}});
  window.addEventListener('pointermove',e=>{if(!drag||!T)return;T.follow=false;T.az-=(e.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(e.clientY-ly)*0.005));lx=e.clientX;ly=e.clientY;placeCam();});
  window.addEventListener('pointerup',()=>drag=false);
  cv.addEventListener('wheel',e=>{e.preventDefault();T.zoom*=e.deltaY>0?0.9:1.1;T.follow=false;placeCam();},{passive:false});
  const td=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  cv.addEventListener('touchstart',e=>{if(e.touches.length===1){two=false;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}else if(e.touches.length===2){two=true;pd=td(e.touches);}},{passive:false});
  cv.addEventListener('touchmove',e=>{e.preventDefault();T.follow=false;if(e.touches.length===2){const d=td(e.touches);if(pd)T.zoom*=d/pd;pd=d;placeCam();}else if(e.touches.length===1&&!two){const t=e.touches[0];T.az-=(t.clientX-lx)*0.008;T.pol=Math.max(0.5,Math.min(1.25,T.pol-(t.clientY-ly)*0.005));lx=t.clientX;ly=t.clientY;placeCam();}},{passive:false});
  cv.addEventListener('touchend',e=>{if(e.touches.length===0){two=false;pd=0;}}); }
/* 隊列ボード(線画): 横=先頭からの差(右が先頭)、縦=内(下)〜外(上) */
function drawFormation(){ const cv=document.getElementById('fm'); if(!cv||!S) return; const dpr=Math.min(2,window.devicePixelRatio||1), w=cv.parentElement.clientWidth||500, h=100; if(cv.width!==Math.round(w*dpr)){cv.width=Math.round(w*dpr);cv.height=h*dpr;cv.style.height=h+'px';}
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h); const hs=S.r.runners, padL=34,padR=14,top=10,bot=h-16;
  x.strokeStyle='#111'; x.lineWidth=1.5; x.strokeRect(padL+.75,top+.75,w-padL-padR-1.5,bot-top-1.5); x.setLineDash([3,4]); x.strokeStyle='#999'; x.lineWidth=1; x.beginPath(); x.moveTo(padL,(top+bot)/2); x.lineTo(w-padR,(top+bot)/2); x.stroke(); x.setLineDash([]);
  x.fillStyle='#666'; x.font='500 9px "DM Mono",monospace'; x.textAlign='right'; x.fillText('OUT',padL-6,top+10); x.fillText('IN',padL-6,bot-2);
  const pos=hs.map((h,i)=>{ const {s,lane}=horsePos(i,1); return {h,i,s,lane}; }); const smax=Math.max(...pos.map(p=>p.s)), span=Math.max(60,smax-Math.min(...pos.map(p=>p.s)));
  pos.sort((a,b)=>a.s-b.s).forEach(p=>{ const px=padL+12+(w-padL-padR-26)*(1-(smax-p.s)/span), py=bot-9-(bot-top-18)*p.lane; x.beginPath(); x.arc(px,py,8,0,Math.PI*2); x.fillStyle=WBG[p.h.waku]||'#999'; x.fill(); x.lineWidth=1.5; x.strokeStyle='#111'; x.stroke(); x.fillStyle=WFG[p.h.waku]||'#fff'; x.font='700 9px "DM Mono",monospace'; x.textAlign='center'; x.textBaseline='middle'; x.fillText(p.h.uno,px,py+.5); x.textBaseline='alphabetic'; });
  x.fillStyle='#111'; x.font='500 9px "DM Mono",monospace'; x.textAlign='left'; x.fillText(S.tracks?`GAP ${Math.round(span)}m`:'GATE',padL,bot+12); x.textAlign='right'; x.fillText('LEAD →',w-padR,bot+12); }
function draw(){ placeHorses(); }
/* ===== 3D END ===== */
</script>
